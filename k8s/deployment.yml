apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s3-k8s-demo
  template:
    metadata:
      labels:
        app: s3-k8s-demo
    spec:
      containers:
        - name: web
          image: s3-k8s-demo:INITIAL
          imagePullPolicy: Never
          ports:
            - containerPort: 80
